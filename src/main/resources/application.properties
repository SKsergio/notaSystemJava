spring.application.name=notas
# ===============================
# 1. CONEXI�N A LA BASE DE DATOS
# ===============================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/NOTA_SYSTEM?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:pass123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# 2. CONFIGURACI�N DE HIBERNATE (ORM)
# ===============================
spring.jpa.hibernate.ddl-auto=create

# ===============================
# 3. MODO DESARROLLADOR
# ===============================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
#Configuracion de archivos(imagenes)
# Ruta absoluta en el disco C
#WINDOWS
#app.storage.photo-dir=./uploads/photos
#LINUX
app.storage.photo-dir=C:/files/photos

# ===============================
# 4. SEGURIDAD / JWT
# Para produccion sobreescriba JWT_SECRET con una variable de entorno (>= 64 caracteres aleatorios)
# ===============================
app.security.jwt.secret=${JWT_SECRET:cambiame-por-favor-este-secreto-debe-tener-minimo-64-caracteres-aleatorios-12345}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.security.jwt.issuer=${JWT_ISSUER:notas-system}
# Credenciales del admin inicial (solo se usan si la tabla users esta vacia)
app.security.bootstrap.admin-email=${ADMIN_EMAIL:admin@notas.local}
app.security.bootstrap.admin-password=${ADMIN_PASSWORD:Admin123!}
